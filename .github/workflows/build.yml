name: Build example

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [v5.5.1, v6.0.1]
        target: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@v5

      # examples/basic pulls the component in from the repository root (override_path) and
      # has no LVGL, so this also proves the headless build.
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/basic

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The registry takes the version from idf_component.yml; a tag that disagrees with it
      # would publish the manifest's version under the wrong release.
      - name: Tag matches manifest version
        run: |
          manifest=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' idf_component.yml)
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match idf_component.yml version $manifest"
            exit 1
          fi

      - uses: espressif/upload-components-ci-action@v2
        with:
          components: "preflight:."
          namespace: "diydoohickeys"
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
